# docker compose up --build
#   dashboard: http://localhost:8501
#   API docs:  http://localhost:8000/docs
services:
  dashboard:
    build: .
    ports:
      - "8501:8501"
  api:
    build: .
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
